{% extends "templates/web.html" %}
{% block page_content %}
<div class="container py-4" style="max-width:650px">
<h2>QR-Etiketten</h2>
<p><a href="/nippey-print">Zur Filamentinventur</a></p>
<p id="label-status" role="status">Lade Druckvorlagen …</p>
<form id="label-form">
<label for="label-format">Etikettenformat</label>
<select id="label-format" class="form-control mb-3" required></select>
<label for="label-start">Startposition</label>
<input id="label-start" class="form-control mb-3" type="number" min="1" value="1" required>
<label for="label-count">Anzahl Etiketten</label>
<input id="label-count" class="form-control mb-3" type="number" min="1" required>
<button id="label-reserve" class="btn btn-primary" disabled>IDs reservieren</button>
<button id="label-calibrate" class="btn btn-secondary" type="button" disabled>Kalibrierungsdruck</button>
</form>
<p class="mt-3">PDF immer in tatsächlicher Größe (100 %) drucken.</p>
<h3>Vorhandene Bögen</h3>
<div id="label-sheets"></div>
</div>
<script src="/assets/nippey_print/js/labels.js" defer></script>
{% endblock %}
