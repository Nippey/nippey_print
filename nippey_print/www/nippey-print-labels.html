{% extends "templates/web.html" %}
{% block page_content %}
<div class="container py-4" style="max-width:650px">
<h2>QR-Etiketten</h2>
<p><a href="/nippey-print">Zur Filamentinventur</a></p>
<p id="label-status" role="status">Lade Druckvorlagen …</p>
<form id="label-form">
<label for="label-format">Etikettenformat</label>
<select id="label-format" class="form-control mb-3" required></select>
<label for="label-start">Startposition</label>
<input id="label-start" class="form-control mb-3" type="number" min="1" value="1" required>
<label for="label-count">Anzahl Etiketten</label>
<input id="label-count" class="form-control mb-3" type="number" min="1" required>
<div id="label-preview" class="mb-3"></div>
<button id="label-reserve" class="btn btn-primary" disabled>IDs reservieren</button>
<button id="label-calibrate" class="btn btn-secondary" type="button" disabled>Kalibrierungsdruck</button>
</form>
<p class="mt-3">PDF immer in tatsächlicher Größe (100 %) drucken.</p>
<h3>Vorhandene Bögen</h3>
<div id="label-sheets"></div>
<form id="label-reprint-form" hidden class="border rounded p-3 mt-3">
<h4>Erneut drucken</h4><p id="label-reprint-source"></p>
<label for="label-reprint-format">Zielformat</label><select id="label-reprint-format" class="form-control mb-2" required></select>
<label for="label-reprint-start">Startposition auf Zielbogen</label><input id="label-reprint-start" type="number" min="1" value="1" class="form-control mb-2" required>
<label for="label-reprint-first">Erstes Etikett (laufende Position im Originalbogen)</label><input id="label-reprint-first" type="number" min="1" value="1" class="form-control mb-2" required>
<label for="label-reprint-count">Anzahl</label><input id="label-reprint-count" type="number" min="1" class="form-control mb-2" required>
<p id="label-reprint-pages"></p><div id="label-reprint-preview" class="mb-3"></div><button id="label-reprint-download" class="btn btn-primary">PDF erzeugen</button>
</form>
</div>
<script src="/assets/nippey_print/js/labels.js?v=20261119-2" defer></script>
<p class="text-center text-muted small">nippey.print {{ app_version }} · Build {{ build_id }}</p>
{% endblock %}
